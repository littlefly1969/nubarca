<!doctype html>
<html lang="it" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- NubArca translates itself (it, en, es, de). A browser translator
         rewriting the DOM under React breaks the page it means to help, so it
         is told, for the whole application, that there is nothing to do. -->
    <meta name="google" content="notranslate" />
    <title>NubArca</title>
    <meta
      name="description"
      content="NubArca — your files, your hardware, your private cloud. Photos, videos and documents on storage you own."
    />
    <meta name="theme-color" content="#0a0f1a" />
    <meta property="og:site_name" content="NubArca" />
    <meta property="og:title" content="NubArca" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/nubarca-pwa-512.png" />
    <meta name="application-name" content="NubArca" />
    <meta name="apple-mobile-web-app-title" content="NubArca" />

    <!-- Approved NubArca favicon family and PWA icons, copied byte-for-byte
         from assets/brand/nubarca/ by scripts/sync-brand-assets.py. -->
    <link rel="icon" href="/brand/favicon.ico" sizes="16x16 24x24 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/nubarca-pwa-192.png" />
    <!-- The apple-touch-icon and the manifest are not here: the party app
         bootstrap at the end of <head> creates them, each with its final address. -->
    <script>
      // Theme bootstrap — runs BEFORE the stylesheet paints and before React
      // mounts, so a light-theme flash is impossible. It mirrors, verbatim, the
      // rules in src/theme/themePreference.ts:
      //   * key 'nubarca.theme' holds exactly 'dark' | 'light' | 'system'
      //   * anything else (missing, stale, unreadable) => 'dark' (the default)
      //   * 'system' asks for prefers-color-scheme: light, so "no preference"
      //     still resolves to dark
      // ThemeProvider re-applies the same value on mount, which is a no-op.
      (function () {
        var effective = 'dark';
        try {
          var valid = function (v) {
            return v === 'dark' || v === 'light' || v === 'system' ? v : null;
          };
          var preference = valid(window.localStorage.getItem('nubarca.theme'));
          if (preference === null) preference = 'dark';
          if (preference === 'system') {
            effective =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          } else {
            effective = preference;
          }
        } catch (e) {
          // Blocked storage / private mode: keep the default.
        }
        document.documentElement.dataset.theme = effective;
      })();
    </script>
    <script>
      // Language bootstrap — sets <html lang> before React mounts, so the page
      // never announces a language it is not in. It mirrors, verbatim,
      // resolveInitialLanguage in src/i18n/I18nProvider.tsx:
      //   1. ?lang= holding exactly 'it' | 'en' | 'es' | 'de'
      //   2. key 'nubarca.lang' holding exactly one of those
      //   3. the browser's languages, in its own order, region tag dropped
      //      ('de-DE' => 'de')
      //   4. 'it'
      // It only reads: nothing is written to storage here. I18nProvider stays
      // the authority after mount and re-applies the same value.
      (function () {
        var supported = function (v) {
          return v === 'it' || v === 'en' || v === 'es' || v === 'de' ? v : null;
        };
        var lang = null;
        try {
          lang = supported(new URLSearchParams(window.location.search).get('lang'));
        } catch (e) {
          // No usable querystring: fall through.
        }
        if (lang === null) {
          try {
            lang = supported(window.localStorage.getItem('nubarca.lang'));
          } catch (e) {
            // Blocked storage / private mode: fall through.
          }
        }
        if (lang === null) {
          try {
            var requested = Array.isArray(navigator.languages)
              ? navigator.languages
              : navigator.language
                ? [navigator.language]
                : [];
            for (var i = 0; i < requested.length && lang === null; i++) {
              if (typeof requested[i] !== 'string') continue;
              lang = supported(requested[i].trim().toLowerCase().split('-')[0]);
            }
          } catch (e) {
            // A navigator whose getters throw: keep the default.
          }
        }
        document.documentElement.lang = lang === null ? 'it' : lang;
      })();
    </script>
    <script>
      // Home-screen app bootstrap — a party's page, a personal invitation and an
      // album shared by link are each their own app. There is no static
      // manifest link: this script CREATES the apple-touch-icon and the
      // manifest links, each born with its final address, so a browser judging
      // the page installable never sees another app's manifest first. Which app
      // is decided from the address alone. It mirrors, verbatim,
      // homeScreenAppForPath and PRODUCT_APP in src/homeScreen/homeScreen.ts:
      //   * an app lives under /party/app/<32 hex>/ or /album/app/<32 hex>/;
      //     that prefix is set aside and the rest of the address read as below,
      //     a party's rules inside a party's app and an album's inside an album's
      //   * /party/<token>         => /api/party/<token>/app-manifest
      //   * /party/invite/<token>  => /api/party-invitations/<token>/app-manifest
      //   * /album/<token>, and /open/<token> inside an album's app
      //                            => /api/album-share/<token>/app-manifest,
      //                               asked for with the visitor's cookie
      //   * a token is [A-Za-z0-9_-]+; 'crew', 'invite' and 'app' are not a
      //     party's tokens, 'app' is not an album's; nothing may follow a
      //     token but one slash
      //   * any other page of an app => no manifest at all
      //   * any other page         => /manifest.webmanifest (the product's)
      // <HomeScreenAppHead /> keeps the same choice on in-app navigation.
      (function () {
        var manifest = '/manifest.webmanifest';
        var credentials = false;
        var icon = '/brand/nubarca-apple-touch-icon-180.png';
        var path = window.location.pathname;
        var app = /^\/(party|album)\/app\/[0-9a-f]{32}(?=\/|$)/.exec(path);
        var api = null;
        var match;
        if (app) {
          manifest = null;
          path = path.slice(app[0].length) || '/';
        }
        if (!app || app[1] === 'party') {
          match = /^\/party\/(?:(invite)\/)?([A-Za-z0-9_-]+)\/?$/.exec(path);
          if (match && (match[1] || (match[2] !== 'crew' && match[2] !== 'invite' && match[2] !== 'app'))) {
            api = (match[1] ? '/api/party-invitations/' : '/api/party/') + encodeURIComponent(match[2]);
          }
        }
        if (!api && (!app || app[1] === 'album')) {
          match = app
            ? /^\/open\/([A-Za-z0-9_-]+)\/?$/.exec(path)
            : /^\/album\/([A-Za-z0-9_-]+)\/?$/.exec(path);
          if (match && match[1] !== 'app') {
            api = '/api/album-share/' + encodeURIComponent(match[1]);
            credentials = true;
          }
        }
        if (api) {
          manifest = api + '/app-manifest';
          icon = api + '/app-icon/192';
        }
        var link = function (rel, href, crossOrigin) {
          var element = document.createElement('link');
          element.setAttribute('rel', rel);
          if (crossOrigin) element.setAttribute('crossorigin', crossOrigin);
          element.setAttribute('href', href);
          document.head.appendChild(element);
        };
        link('apple-touch-icon', icon, null);
        if (manifest) link('manifest', manifest, credentials ? 'use-credentials' : null);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
