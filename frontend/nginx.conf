# Internal nginx config baked into the frontend container image.
# Serves the SPA bundle with a client-side-routing fallback. The host's
# reverse proxy (nginx / Caddy / Traefik / …) terminates TLS in front of
# this and routes `/api/*`, `/health`, `/s/*` to the api container.

# Link previews. A chat app sent a party's link fetches the page to draw its
# card — title, description, picture — and runs no JavaScript, so the SPA's one
# index.html can only ever describe NubArca itself. For those fetchers, and only
# on a party's landing page, the card comes from the API, which knows the party.
# People get the SPA exactly as before.
map $http_user_agent $nubarca_link_preview {
    default 0;
    "~*(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|Slackbot|Discordbot|LinkedInBot|SkypeUriPreview|Viber|Pinterest|redditbot|Iframely|Embedly|vkShare)" 1;
}

server {
    listen 80 default_server;
    server_name _;

    # Strip the nginx version from error pages and headers.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, asked at REQUEST time: with the API's name in a
    # variable, nginx never resolves it at startup, so this container starts —
    # and `nginx -t` passes — whether or not the api container is up.
    resolver 127.0.0.11 valid=30s ipv6=off;
    # A name that cannot be resolved must fail fast, not hang a chat app's fetch.
    resolver_timeout 2s;

    # A party's landing page: the SPA for people, the API's card for link
    # previewers. Deeper party routes (/game, /print, …) are untouched.
    location ~ ^/party/(?<party_token>[A-Za-z0-9_-]+)/?$ {
        if ($nubarca_link_preview) {
            rewrite ^ /__link-preview/$party_token last;
        }
        try_files $uri $uri/ /index.html;
    }

    # A PERSONAL invitation, on the same terms. It is a different route and a
    # different token family from the party's QR above, so it needs its own
    # location: the regex there matches ONE path segment and deliberately lets
    # /party/invite/<token> fall through to the SPA — which is exactly how a
    # forwarded invitation came to draw the product's logo instead of the party.
    location ~ ^/party/invite/(?<invite_token>[A-Za-z0-9_-]+)/?$ {
        if ($nubarca_link_preview) {
            rewrite ^ /__invite-preview/$invite_token last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/__invite-preview/(?<invite_preview_token>[A-Za-z0-9_-]+)$ {
        internal;
        set $nubarca_api http://api:8080;
        proxy_pass $nubarca_api/api/party-invitations/$invite_preview_token/link-preview;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 404 429 500 502 503 504 = /index.html;
    }

    location ~ ^/__link-preview/(?<preview_token>[A-Za-z0-9_-]+)$ {
        internal;
        set $nubarca_api http://api:8080;
        proxy_pass $nubarca_api/api/party/$preview_token/link-preview;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        # An API that cannot answer leaves the generic NubArca card, never an
        # error page in somebody's chat.
        proxy_intercept_errors on;
        error_page 404 429 500 502 503 504 = /index.html;
    }

    # SPA fallback — any path that doesn't match a static file falls back to
    # /index.html so client-side router URLs survive a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundle assets (produced by Vite under /assets/) are immutable —
    # they include a content hash in the filename. Cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Stable sideload URL for Fire TV / Android TV. The host directory is
    # mounted read-only by docker-compose; publishing replaces the APK
    # atomically, so a client can never receive a partially uploaded file.
    # Keep /tv.apk as a short alias that is practical with a TV remote.
    location = /tv.apk {
        alias /usr/share/nginx/html/download/tv/nubarca-tv.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="nubarca-tv.apk"' always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /download/tv/nubarca-tv.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="nubarca-tv.apk"' always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /download/tv/nubarca-tv.apk.sha256 {
        default_type text/plain;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Immutable versioned APKs, published beside the canonical one for the
    # in-app updater. The name carries the Android versionCode, so the bytes
    # behind a given name never change and may be cached hard.
    location ~ ^/download/tv/nubarca-tv-v[0-9]+\.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The native release descriptor is the ACTIVATION POINTER for in-app
    # updates, so it must never be served stale — and a missing one must be a
    # real 404 rather than the SPA fallback answering HTTP 200 with index.html.
    location = /download/tv/nubarca-tv.release.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Never cache index.html so a new deploy is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
