# Internal nginx config baked into the frontend container image.
# Serves the SPA bundle with a client-side-routing fallback. The host's
# reverse proxy (nginx / Caddy / Traefik / …) terminates TLS in front of
# this and routes `/api/*`, `/health`, `/s/*` to the api container.

server {
    listen 80 default_server;
    server_name _;

    # Strip the nginx version from error pages and headers.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any path that doesn't match a static file falls back to
    # /index.html so client-side router URLs survive a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundle assets (produced by Vite under /assets/) are immutable —
    # they include a content hash in the filename. Cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Stable sideload URL for Fire TV / Android TV. The host directory is
    # mounted read-only by docker-compose; publishing replaces the APK
    # atomically, so a client can never receive a partially uploaded file.
    # Keep /tv.apk as a short alias that is practical with a TV remote.
    location = /tv.apk {
        alias /usr/share/nginx/html/download/tv/nubarca-tv.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="nubarca-tv.apk"' always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /download/tv/nubarca-tv.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="nubarca-tv.apk"' always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /download/tv/nubarca-tv.apk.sha256 {
        default_type text/plain;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Never cache index.html so a new deploy is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
