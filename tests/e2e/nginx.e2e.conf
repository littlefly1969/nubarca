# Single-origin front door for the E2E stack.
#
# WHY THIS EXISTS. The suite originally drove the app through the frontend's Vite
# dev proxy. Chromium tolerated it, but WebKit and Firefox rejected every `/api`
# call with "Fetch API cannot load … due to access control checks", because the
# dev proxy does not make the API genuinely same-origin. That produced 96 failures
# that looked like product defects and were not.
#
# Production serves the built app and the API from ONE origin behind nginx, so the
# test stack does the same. The browsers then see exactly the origin model the
# product actually ships, and cross-engine differences in the results mean
# something.
server {
    listen 80;
    server_name _;

    # Resolve the API through Docker's embedded DNS AT REQUEST TIME. nginx
    # resolves a literal upstream once, at startup, and refuses to boot when the
    # name is not yet registered — which is exactly what happened here. Using a
    # variable defers resolution, so the front door survives the API appearing a
    # moment later.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # Forward the host the BROWSER addressed, port included ($http_host), not
    # nginx's normalized $host, which strips it.
    #
    # CsrfOriginValidation compares the browser's Origin against the request's
    # own scheme/host/port, so Request.Host must be the public address. With
    # $host the API saw "127.0.0.1" and inferred port 80, while the Origin said
    # ":5273" — so every state-changing /api call, login included, was rejected
    # 403 and the suite never left /login. A deployment on the default port
    # hides the bug, because the stripped port and the inferred one agree.

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 512M;

    # The API, same origin as the app — no CORS involved, as in production.
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Uploads and range requests must stream rather than buffer.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass $api_upstream/health;
        proxy_set_header Host $http_host;
    }

    # Public share links.
    location ~ ^/s/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Never cache the shell, so a rebuild is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SPA fallback: client routes such as /media and /tv are resolved in the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
