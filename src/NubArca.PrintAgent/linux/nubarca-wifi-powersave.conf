# NubArca Print Box: keep the Wi-Fi radio awake.
#
# With power save on, the adapter dozes between packets and the box's requests
# to its server stall or fail: DNS lookups time out, "No route to host", a
# print's download crawls. A print station is plugged in and must answer at
# once, so the saving is not worth it.
#
# 2 = disabled. Installed as /etc/NetworkManager/conf.d/zz-nubarca-wifi-powersave.conf:
# NetworkManager reads conf.d in name order and the last file wins, so the
# name sorts after Ubuntu's default-wifi-powersave-on.conf.
[connection]
wifi.powersave = 2
