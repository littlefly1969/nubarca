name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  identity:
    name: Product identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify NubArca identity contract
        run: scripts/check-nubarca-identity.sh

      # Every merge into main is a release, so a pull request into main must
      # raise the release version above main's current one (CLAUDE.md,
      # "Release version"). Compared with main's tip, not the PR's base, so two
      # PRs that picked the same number cannot both merge.
      - name: Check out main's release version
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: actions/checkout@v6
        with:
          ref: main
          path: .release-base
          persist-credentials: false
          sparse-checkout: src/NubArca.Api/NubArca.Api.csproj
          sparse-checkout-cone-mode: false

      - name: Verify the release version goes up
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: python3 scripts/check-release-version.py .release-base/src/NubArca.Api/NubArca.Api.csproj

      # BRAND-APP-01 §G. The brand contract is machine-checkable, so it is
      # checked: primitives against the canonical manifest, and the mobile
      # client strictly — splash configuration, token values, product spelling
      # and colour literals.
      - name: Verify NubArca brand invariants
        run: python3 scripts/check-brand-invariants.py

      # Consumer copies of brand artwork must stay byte-identical to the
      # approved package; a re-exported or hand-edited asset fails here.
      - name: Verify brand asset consumer copies
        run: python3 scripts/sync-brand-assets.py --check

  # The fast suite takes about 40 minutes in one job, so it runs as parallel
  # slices balanced on recorded class durations (scripts/backend-test-shards.py,
  # tests/backend-test-timings.json). Every slice lists the build it made and
  # computes the same partition, so together they run every class once.
  backend_shard:
    name: Backend fast tests (${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore tests/NubArca.Api.Tests/NubArca.Api.Tests.csproj

      - name: Build
        run: >-
          dotnet build tests/NubArca.Api.Tests/NubArca.Api.Tests.csproj
          --configuration Release
          --no-restore

      # The production media tools (FFmpeg 9 — the digest the API Dockerfile
      # pins), so the HEIC tests decode for real instead of being skipped. The
      # package is public; nothing to log in to.
      - name: Install media tools
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          digest="$(sed -n 's/^ARG MEDIA_TOOLS_IMAGE=.*@\(sha256:[0-9a-f]\{64\}\)$/\1/p' src/NubArca.Api/Dockerfile)"
          cid="$(docker create "ghcr.io/${owner}/nubarca-media-tools@${digest}" /none)"
          sudo mkdir -p /opt/nubarca/media
          sudo docker cp "$cid:/opt/nubarca/media/." /opt/nubarca/media/
          docker rm "$cid" >/dev/null
          echo /opt/nubarca/media/bin >> "$GITHUB_PATH"
          /opt/nubarca/media/bin/ffmpeg -hide_banner -version | head -1

      - name: Run fast backend tests
        run: >-
          scripts/test-backend-fast.sh
          --shard ${{ matrix.shard }}/8
          --configuration Release
          --no-restore
          --no-build
          --logger trx
          --results-directory "$GITHUB_WORKSPACE/TestResults/backend-fast"

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-fast-test-results-${{ matrix.shard }}
          path: TestResults/backend-fast/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  # The one check branch protection and reviewers look at: green only when
  # every slice passed.
  backend:
    name: Backend build and fast tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: backend_shard
    if: always()
    steps:
      # Fresh per-class timings from this run's slices, as an artifact
      # (backend-test-timings) to copy over tests/backend-test-timings.json
      # when the slices drift apart. Informational: never affects the gate.
      - name: Check out source
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download slice results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: backend-fast-test-results-*
          path: TestResults/backend-fast

      - name: Measure class timings
        continue-on-error: true
        run: |
          set -euo pipefail
          shopt -s globstar
          scripts/backend-test-shards.py timings TestResults/backend-fast/**/*.trx
          cat tests/backend-test-timings.json

      - name: Upload class timings
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-timings
          path: tests/backend-test-timings.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Every slice passed
        run: |
          echo "slices: ${{ needs.backend_shard.result }}"
          test "${{ needs.backend_shard.result }}" = success

  backend_concurrency:
    # THE RACES ARE PART OF THE GATE.
    #
    # Album Share's concurrency invariants — one live link per album, a
    # rotation that cannot resurrect a removed address, one challenge per
    # resend, a guest ceiling that holds both ways in — can only be tested
    # against real PostgreSQL: the fast lane's SQLite host hands every scope one
    # pooled connection, so "concurrent" requests are serialised by the
    # transport before they reach the code. Those tests carry
    # Category=External, which the fast lane excludes, so until now the most
    # important properties of the feature were not in the merge gate at all.
    name: Backend concurrency (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NUBARCA_NAVIGATION_BENCHMARK: '1'
      NUBARCA_NAVIGATION_BENCHMARK_OUTPUT: ${{ github.workspace }}/TestResults/media-navigation-performance
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore tests/NubArca.Api.Tests/NubArca.Api.Tests.csproj

      - name: Build
        run: >-
          dotnet build tests/NubArca.Api.Tests/NubArca.Api.Tests.csproj
          --configuration Release
          --no-restore

      # Deliberately NOT the whole External suite, which is a nightly's worth of
      # work. These are the races the features' correctness rests on: Album
      # Share's, and the party guest book's against the game (one holder of the
      # television) and against the end of the party (never on after it), and an
      # owner's direct print (one key, one sheet; a loan's last sheet taken once).
      # Navigation also needs the real provider's collation, grouping and seeks.
      # RemoveSystemRagIndex drops tables, so its Up/Down runs here too.
      - name: Run concurrency and media navigation tests
        run: >-
          dotnet test tests/NubArca.Api.Tests/NubArca.Api.Tests.csproj
          --configuration Release
          --no-restore
          --no-build
          --filter "FullyQualifiedName~AlbumShareConcurrencyPostgresTests|FullyQualifiedName~AlbumVersionConcurrencyPostgresTests|FullyQualifiedName~PartyGuestbookGameRacePostgresTests|FullyQualifiedName~PartyGuestbookEndLiveRacePostgresTests|FullyQualifiedName~OwnerPhotoPrintRacePostgresTests|FullyQualifiedName~MediaNavigationPostgresTests|FullyQualifiedName~MediaNavigationPerformanceTests|FullyQualifiedName~RemoveSystemRagIndexMigrationTests"
          --logger "console;verbosity=normal"
          --logger trx
          --results-directory "$GITHUB_WORKSPACE/TestResults/backend-concurrency"

      # A SKIPPED RACE IS NOT A PASSED ONE. The fixture answers
      # `Skip.IfNot(Available)` when Docker is missing, so a runner without it
      # would produce a green job that tested nothing. The gate has to fail when
      # the races could not run, not only when they ran and lost.
      - name: Assert the races actually ran
        run: python3 scripts/assert-concurrency-gate.py
          "$GITHUB_WORKSPACE/TestResults/backend-concurrency"

      - name: Upload concurrency test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-concurrency-test-results
          path: TestResults/backend-concurrency/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload media navigation timings and query plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-navigation-performance
          path: TestResults/media-navigation-performance/
          if-no-files-found: error
          retention-days: 14

  print_agent:
    name: Print Agent build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/NubArca.PrintAgent.Tests/NubArca.PrintAgent.Tests.csproj

      - name: Check the Print Agent bundle trust boundary
        run: node --test deploy/tests/printAgentBundle.test.mjs

      # The signed release manifest and the host updater: what an installation
      # accepts before it installs anything.
      - name: Check the release and updater trust boundary
        run: node --test deploy/tests/releaseManifest.test.mjs deploy/tests/releaseTrust.test.mjs deploy/tests/hostUpdater.test.mjs deploy/tests/printBoxUpdate.test.mjs deploy/tests/productionRollback.test.mjs

      - name: Build and test
        run: dotnet test tests/NubArca.PrintAgent.Tests/NubArca.PrintAgent.Tests.csproj --configuration Release --no-restore

      - name: Prove Windows publish
        run: >-
          dotnet publish src/NubArca.PrintAgent/NubArca.PrintAgent.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --no-restore -p:PublishSingleFile=false -p:DebugType=None
          --output "$RUNNER_TEMP/print-agent-smoke"

      - name: Prove Linux simulator publish
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/print-agent-linux-smoke"
          dotnet publish src/NubArca.PrintAgent/NubArca.PrintAgent.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            --no-restore -p:PublishSingleFile=false -p:DebugType=None \
            --output "$output"
          test -x "$output/NubArca.PrintAgent"
          test -f "$output/linux/install-fake-instance.sh"
          test -f "$output/linux/uninstall-instance.sh"
          test -f "$output/linux/nubarca-print-agent@.service"

  frontend:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

  # MailArchive's read-only PST engine: the Rust quality gate, then the .NET
  # side against the binary just built (the fast lane skips those tests,
  # having no binary). The PST fixtures are committed under the tool.
  pst-importer:
    name: PST engine (Rust) and its .NET integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/nubarca-pst-importer
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.90 --profile minimal --component rustfmt,clippy
          rustup default 1.90

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build the release binary
        run: cargo build --release --locked -p nubarca-pst-importer

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: .NET against the real engine
        working-directory: .
        env:
          NUBARCA_PST_IMPORTER_BIN: ${{ github.workspace }}/tools/nubarca-pst-importer/target/release/nubarca-pst-importer
        run: dotnet test tests/NubArca.Api.Tests/NubArca.Api.Tests.csproj --filter "FullyQualifiedName~MailArchiveRealEngineTests"

  # A browser running /tv is a NubArca display: paired, assigned, taken over
  # by a game and handed back, reloaded, revoked — end to end, in a real
  # headless Chrome against a real API and database. See
  # scripts/tv-browser-e2e.sh; nothing in it is an installation.
  tv-browser-e2e:
    name: Browser TV end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run the browser display end to end
        run: CHROME_BIN="$(command -v google-chrome)" scripts/tv-browser-e2e.sh

  tv:
    name: TV typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tv
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tv/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run tests
        run: npm test

      # Already covered: `npm test` is a strict superset of `test:ota` today.
      # It is listed separately because that superset is a hand-maintained file
      # list, so a future edit could drop an OTA file from it and lose the
      # coverage silently. This is also the exact command docs/tv-release.md
      # tells an operator to run before publishing, so CI runs what the release
      # procedure runs.
      - name: Run OTA release-tooling tests
        run: npm run test:ota

  contracts:
    name: Shared contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # No install step and no node_modules: @nubarca/contracts is pure
      # TypeScript with no dependencies at all, which is what lets one package
      # serve a bundler and two Metro apps without a build.
      #
      # The suite proves the package stays platform-neutral (no React, no DOM,
      # no transport), that the canonical query serialization puts exactly the
      # expected parameters on the wire, and — the point of the whole thing —
      # that the web and mobile transports route through those canonical
      # builders instead of growing private ones that drift.
      - name: Run contract and cross-client parity tests
        run: npm test

  mobile:
    name: Mobile typecheck & tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # The mobile automated suite: session-cookie hardening, pagination
      # races, selection, authenticated media sources, API contracts,
      # unified-album cards/capabilities, viewer privacy, logout order.
      - name: Run tests
        run: npm test

      # Fails closed on a production config without an https origin; also
      # proves app.config.js evaluates cleanly with plugins applied.
      - name: Validate Expo config
        run: npm run config

      # VERIFIED, not declared: the production fail-closed rules are exercised
      # under all four environment combinations (no origin / http / https /
      # development), asserting Android cleartext and iOS ATS stay off.
      - name: Production config gate
        run: node scripts/verify-production-config.mjs

  # Whether this change can affect the Android app: the app itself, the shared
  # contracts it bundles, or this workflow. Pushes to main and manual runs
  # always count as yes.
  changes:
    name: Detect mobile changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - name: Check out source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compare with the base branch
        id: diff
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          if grep -qE '^(mobile/|packages/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  # The slowest job in CI (the APK build alone is about 7 minutes), so it runs
  # only when the change can affect the app. A skipped job satisfies a
  # required check, so this fails closed: when the detector itself did not
  # succeed, the smoke runs.
  mobile_android_startup:
    name: Mobile Android startup smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: changes
    if: >-
      always() &&
      (needs.changes.result != 'success' || needs.changes.outputs.mobile == 'true')
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle's dependencies and build cache between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK and emulator image
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path=""
          for candidate in \
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "$sdk_root"/cmdline-tools/*/bin/sdkmanager \
            "$sdk_root/tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then
              sdkmanager_path="$candidate"
              break
            fi
          done
          [[ -n "$sdkmanager_path" ]] || {
            echo "Android sdkmanager not found below $sdk_root" >&2
            exit 1
          }
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
          } >> "$GITHUB_ENV"
          {
            dirname "$sdkmanager_path"
            echo "$sdk_root/platform-tools"
            echo "$sdk_root/emulator"
            echo "$sdk_root/build-tools/36.0.0"
            echo "$sdk_root/cmdline-tools/latest/bin"
            echo "$sdk_root/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin"
          } >> "$GITHUB_PATH"
          "$sdkmanager_path" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "emulator" \
            "system-images;android-35;default;x86_64"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --include=dev

      - name: Generate native Android project
        working-directory: mobile
        run: npm run android:prebuild

      - name: Build debug APK
        working-directory: mobile/android
        run: >-
          ./gradlew --no-daemon
          -PreactNativeArchitectures=x86_64
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
          :app:assembleDebug

      - name: Start Metro for the debug APK
        working-directory: mobile
        run: |
          set -euo pipefail
          nohup npx expo start --localhost --port 8081 \
            > "$RUNNER_TEMP/mobile-metro.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/mobile-metro.pid"
          timeout 120 bash -c \
            'until curl --fail --silent http://127.0.0.1:8081/status | grep -q "packager-status:running"; do sleep 2; done'

      - name: Cold-launch APK in Android emulator
        run: |
          set -euo pipefail
          sudo chmod 0666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd \
            --force \
            --name nubarca-ci-api35 \
            --package 'system-images;android-35;default;x86_64' \
            --device pixel_6
          nohup emulator \
            -avd nubarca-ci-api35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -no-metrics \
            > "$RUNNER_TEMP/mobile-emulator.log" 2>&1 &
          timeout 300 bash -c \
            'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 2; done'
          adb reverse tcp:8081 tcp:8081
          bash mobile/scripts/smoke-android-startup.sh \
            mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Stop Android emulator and Metro
        if: always()
        run: |
          adb emu kill || true
          if [[ -f "$RUNNER_TEMP/mobile-metro.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/mobile-metro.pid")" || true
          fi

      - name: Upload emulator log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-emulator-log
          path: |
            ${{ runner.temp }}/mobile-emulator.log
            ${{ runner.temp }}/mobile-metro.log
          if-no-files-found: ignore
          retention-days: 7
