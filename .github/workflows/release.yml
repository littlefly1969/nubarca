name: Release

# Every push to main becomes an installable release: the components whose
# paths changed are built and verified (build-production-images.yml,
# print-agent-release.yml), and one signed manifest names, by digest, the
# images that make up this commit. Installations update only to a manifest
# whose Sigstore signature proves it was written by THIS workflow on main
# (deploy/release-manifest.py, SIGNER_IDENTITY); GitHub never connects to an
# installation.
#
# A component that did not change is not rebuilt: the manifest names the image
# built from the last commit that changed it, and an installation re-checks
# against Git that nothing of that component changed since.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, never cancelled half-way: a newer push waits, and
# finds the images this run published.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Pinned with its published checksum; verify-blob on the installation uses
  # the same major version (deploy/updater/install-updater.sh).
  COSIGN_VERSION: v2.6.1
  COSIGN_SHA256: 064954c5d8c7e3b28188eee5b1727b31c411550bc5fefd41aa672d3c761d103a

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      api: ${{ steps.plan.outputs.api }}
      frontend: ${{ steps.plan.outputs.frontend }}
      print_agent: ${{ steps.plan.outputs.print_agent }}
    steps:
      - name: Enforce release policy
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Releases are made only from main; got $GITHUB_REF" >&2
            exit 1
          }

      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A component is built when no image exists for the last commit that
      # changed it — normally because this push changed it, or because the run
      # that should have built it failed.
      - name: Decide what to build
        id: plan
        run: |
          set -euo pipefail
          owner="$(python3 deploy/release-manifest.py trust owner)"
          python3 deploy/release-manifest.py plan . "$GITHUB_SHA" > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          exists() { docker buildx imagetools inspect "$1" >/dev/null 2>&1; }
          last() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$RUNNER_TEMP/plan.json" "$1"; }
          api=false; frontend=false; print_agent=false
          exists "$REGISTRY/$owner/nubarca-api-openvino:$(last api)" && \
            exists "$REGISTRY/$owner/nubarca-api:$(last api)" || api=true
          exists "$REGISTRY/$owner/nubarca-frontend:$(last frontend)" || frontend=true
          exists "$REGISTRY/$owner/nubarca-print-agent:$(last print-agent)-linux-x64" || print_agent=true
          {
            echo "api=$api"
            echo "frontend=$frontend"
            echo "print_agent=$print_agent"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan for \`$GITHUB_SHA\`"
            echo
            echo "| Component | Build now |"
            echo "| --- | --- |"
            echo "| api | $api |"
            echo "| frontend | $frontend |"
            echo "| print-agent | $print_agent |"
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Application images
    needs: plan
    if: needs.plan.outputs.api == 'true' || needs.plan.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-production-images.yml
    with:
      backend: ${{ needs.plan.outputs.api == 'true' }}
      frontend: ${{ needs.plan.outputs.frontend == 'true' }}

  print_agent:
    name: Print Box bundle
    needs: plan
    if: needs.plan.outputs.print_agent == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/print-agent-release.yml
    with:
      runtime: linux-x64
      publish: true

  manifest:
    name: Sign and publish the release manifest
    needs: [plan, images, print_agent]
    if: >-
      always() && needs.plan.result == 'success'
      && (needs.images.result == 'success' || needs.images.result == 'skipped')
      && (needs.print_agent.result == 'success' || needs.print_agent.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Keyless Sigstore signing: the certificate names this workflow, this
      # repository and refs/heads/main, which is what installations verify.
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each image is named by digest and checked to carry the commit the
      # manifest says it was built from: an image is never trusted by its tag.
      - name: Resolve component images
        id: resolve
        run: |
          set -euo pipefail
          owner="$(python3 deploy/release-manifest.py trust owner)"
          python3 deploy/release-manifest.py plan . "$GITHUB_SHA" > "$RUNNER_TEMP/plan.json"
          last() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$RUNNER_TEMP/plan.json" "$1"; }
          # A component built in THIS run carries this commit, not its last change.
          source_for() {
            local component="$1" built="$2" candidate
            candidate="$(last "$component")"
            [[ "$built" == true ]] && candidate="$GITHUB_SHA"
            printf '%s' "$candidate"
          }
          digest() { docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'; }
          revision_env() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' |
              python3 -c 'import json,sys
          image=json.load(sys.stdin); config=image.get("config") or {}
          env=dict(e.split("=",1) for e in config.get("Env") or [] if "=" in e)
          print(env.get("NUBARCA_GIT_SHA") or (config.get("Labels") or {}).get("org.opencontainers.image.revision",""))'
          }
          api_sha="$(source_for api '${{ needs.plan.outputs.api }}')"
          frontend_sha="$(source_for frontend '${{ needs.plan.outputs.frontend }}')"
          agent_sha="$(source_for print-agent '${{ needs.plan.outputs.print_agent }}')"
          refs=(
            "api runtime $REGISTRY/$owner/nubarca-api $api_sha"
            "api openvino $REGISTRY/$owner/nubarca-api-openvino $api_sha"
            "frontend default $REGISTRY/$owner/nubarca-frontend $frontend_sha"
            "print-agent linux-x64 $REGISTRY/$owner/nubarca-print-agent $agent_sha"
          )
          printf '' > "$RUNNER_TEMP/images.tsv"
          for line in "${refs[@]}"; do
            read -r component variant repository source <<< "$line"
            tag="$source"
            [[ "$component" == print-agent ]] && tag="$source-linux-x64"
            image_digest="$(digest "$repository:$tag")"
            revision="$(revision_env "$repository@$image_digest")"
            [[ "$revision" == "$source" ]] || {
              echo "$repository:$tag carries revision '$revision', expected $source" >&2
              exit 1
            }
            printf '%s\t%s\t%s\t%s\n' "$component" "$variant" "$repository@$image_digest" "$source" >> "$RUNNER_TEMP/images.tsv"
          done
          python3 - "$RUNNER_TEMP/images.tsv" "$RUNNER_TEMP/components.json" <<'PY'
          import json, re, subprocess, sys
          rows = [line.rstrip("\n").split("\t") for line in open(sys.argv[1]) if line.strip()]
          def version(source, path):
              text = subprocess.run(["git", "show", f"{source}:{path}"], capture_output=True, text=True, check=True).stdout
              match = re.search(r"<Version>(\d+\.\d+\.\d+)</Version>", text)
              return match.group(1) if match else None
          result = {}
          for component, variant, image, source in rows:
              entry = result.setdefault(component, {"sourceSha": source, "images": {}})
              entry["images"][variant] = image
          result["api"]["version"] = version(result["api"]["sourceSha"], "src/NubArca.Api/NubArca.Api.csproj")
          result["print-agent"]["version"] = version(result["print-agent"]["sourceSha"], "src/NubArca.PrintAgent/NubArca.PrintAgent.csproj")
          json.dump(result, open(sys.argv[2], "w"), indent=2)
          PY
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/NubArca.Api/NubArca.Api.csproj)"
          python3 deploy/release-manifest.py build "$GITHUB_SHA" "$version" "$RUNNER_TEMP/components.json" \
            > "$RUNNER_TEMP/release.json"
          cat "$RUNNER_TEMP/release.json"

      - name: Install cosign
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/cosign"

      # Two ways to sign, chosen by the commit itself, so CI and every
      # installation always agree:
      # - keyless (default): Sigstore certifies this workflow on main. Nothing
      #   to keep secret; the public transparency log records the repository
      #   and workflow name.
      # - own key: when deploy/release-signing.pub is committed, the manifest
      #   is signed with the private key in the RELEASE_SIGNING_KEY repository
      #   secret (cosign generate-key-pair), and nothing is published to the
      #   transparency log (for a private repository).
      - name: Sign the manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.RELEASE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -f deploy/release-signing.pub ]]; then
            [[ -n "${RELEASE_SIGNING_KEY:-}" ]] || {
              echo "deploy/release-signing.pub is committed but RELEASE_SIGNING_KEY is not set" >&2
              exit 1
            }
            "$RUNNER_TEMP/cosign" sign-blob --yes --key env://RELEASE_SIGNING_KEY --tlog-upload=false \
              --bundle "$RUNNER_TEMP/release.sigstore.json" "$RUNNER_TEMP/release.json"
            "$RUNNER_TEMP/cosign" verify-blob --key deploy/release-signing.pub --insecure-ignore-tlog=true \
              --bundle "$RUNNER_TEMP/release.sigstore.json" "$RUNNER_TEMP/release.json"
          else
            "$RUNNER_TEMP/cosign" sign-blob --yes \
              --bundle "$RUNNER_TEMP/release.sigstore.json" \
              "$RUNNER_TEMP/release.json"
            # Proved here exactly as an installation will prove it.
            "$RUNNER_TEMP/cosign" verify-blob \
              --bundle "$RUNNER_TEMP/release.sigstore.json" \
              --certificate-identity "$(python3 deploy/release-manifest.py trust identity)" \
              --certificate-oidc-issuer "$(python3 deploy/release-manifest.py trust issuer)" \
              "$RUNNER_TEMP/release.json"
          fi

      - name: Publish the release manifest image
        run: |
          set -euo pipefail
          image="$(python3 deploy/release-manifest.py trust release-image):$GITHUB_SHA"
          context="$RUNNER_TEMP/release-context"
          install -d "$context"
          cp "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release.sigstore.json" "$context/"
          printf 'FROM scratch\nCOPY release.json release.sigstore.json /release/\n' > "$context/Dockerfile"
          docker buildx build --push --provenance=false --sbom=false \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label io.nubarca.artifact=release \
            -t "$image" "$context"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          {
            echo "## Release \`$GITHUB_SHA\`"
            echo
            echo "Signed manifest: \`$image\` (\`$digest\`)"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/release.json"
            echo '```'
            echo
            echo "Install it from the administration page (**Cloud functions → Updates**)"
            echo "or on the server with \`./deploy/update-production.sh check --env-file .env\`."
          } >> "$GITHUB_STEP_SUMMARY"
