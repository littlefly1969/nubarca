name: TV OTA release

# GitHub is the only ordinary OTA signer/publisher. Production never builds or
# signs: it pulls this validated bundle by digest and activates it locally.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated OTA bundle to GHCR for server-side pull
        required: true
        default: false
        type: boolean
      confirm_git_sha:
        description: Exact full main SHA (required when publishing)
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: tv-ota-release-production
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, validate, and optionally publish Fire TV OTA bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: tv-production
    env:
      CI: true
      NODE_ENV: production
      REGISTRY: ghcr.io
      NUBARCA_PUBLIC_ORIGIN: ${{ vars.NUBARCA_PUBLIC_ORIGIN }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce OTA release policy
        env:
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          CONFIRMED_GIT_SHA: ${{ inputs.confirm_git_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "OTA releases are allowed only from main; got $GITHUB_REF" >&2
            exit 1
          }
          [[ "$(git branch --show-current)" == "main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          if [[ "$REQUESTED_PUBLISH" == "true" ]]; then
            [[ "$CONFIRMED_GIT_SHA" == "$GITHUB_SHA" ]] || {
              echo "confirm_git_sha must exactly equal $GITHUB_SHA" >&2
              exit 1
            }
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tv/package-lock.json

      - name: Install TV dependencies
        working-directory: tv
        run: npm ci --include=dev

      - name: Typecheck TV application
        working-directory: tv
        run: npm run lint

      - name: Run TV tests before exposing signing material
        working-directory: tv
        run: npm test

      - name: Check required production values
        env:
          TV_OTA_CERTIFICATE_BASE64: ${{ secrets.NUBARCA_TV_OTA_CERTIFICATE_BASE64 }}
          TV_OTA_PRIVATE_KEY_BASE64: ${{ secrets.NUBARCA_TV_OTA_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in NUBARCA_PUBLIC_ORIGIN TV_OTA_CERTIFICATE_BASE64 TV_OTA_PRIVATE_KEY_BASE64; do
            [[ -n "${!name:-}" ]] || { echo "Missing tv-production value: $name" >&2; exit 1; }
          done

      # The private key exists only after repository tests have passed and is
      # removed with the ephemeral GitHub runner.
      - name: Materialize OTA signing inputs
        env:
          TV_OTA_CERTIFICATE_BASE64: ${{ secrets.NUBARCA_TV_OTA_CERTIFICATE_BASE64 }}
          TV_OTA_PRIVATE_KEY_BASE64: ${{ secrets.NUBARCA_TV_OTA_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          signing="$RUNNER_TEMP/nubarca-tv-ota-signing"
          install -d -m 0700 "$signing"
          printf '%s' "$TV_OTA_CERTIFICATE_BASE64" | base64 --decode > "$signing/certificate.pem"
          printf '%s' "$TV_OTA_PRIVATE_KEY_BASE64" | base64 --decode > "$signing/private-key.pem"
          chmod 0600 "$signing/certificate.pem" "$signing/private-key.pem"
          {
            echo "NUBARCA_TV_OTA_CERTIFICATE=$signing/certificate.pem"
            echo "TV_OTA_PRIVATE_KEY_PATH=$signing/private-key.pem"
          } >> "$GITHUB_ENV"

      - name: Build and validate signed OTA bundle
        id: bundle
        working-directory: tv
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/nubarca-tv-ota-$GITHUB_SHA"
          npm run bundle:ota -- "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "update_id=$(node -p "require('$output/bundle.json').updateId")" >> "$GITHUB_OUTPUT"
          echo "runtime=$(node -p "require('$output/bundle.json').runtimeVersion")" >> "$GITHUB_OUTPUT"

      - name: Upload validated OTA bundle
        uses: actions/upload-artifact@v4
        with:
          name: nubarca-tv-ota-${{ github.sha }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Resolve immutable OTA bundle image
        if: ${{ inputs.publish }}
        id: image
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${owner}/nubarca-tv-ota:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: ${{ inputs.publish }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace an existing immutable OTA image
        if: ${{ inputs.publish }}
        run: |
          if docker buildx imagetools inspect '${{ steps.image.outputs.image }}' >/dev/null 2>&1; then
            echo "Immutable OTA image tag already exists: ${{ steps.image.outputs.image }}" >&2
            exit 1
          fi

      - name: Build OTA bundle image
        if: ${{ inputs.publish }}
        run: |
          docker buildx build --load \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg RUNTIME_VERSION='${{ steps.bundle.outputs.runtime }}' \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -f deploy/Dockerfile.tv-ota-bundle \
            -t '${{ steps.image.outputs.image }}' \
            '${{ steps.bundle.outputs.path }}'

      - name: Verify OTA image contains the exact validated bundle
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/verified-tv-ota-image"
          install -d -m 0755 "$extracted"
          container="$(docker create '${{ steps.image.outputs.image }}' /bin/true)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/release/." "$extracted"
          diff -qr '${{ steps.bundle.outputs.path }}' "$extracted"

      - name: Publish immutable OTA bundle image
        if: ${{ inputs.publish }}
        run: docker push '${{ steps.image.outputs.image }}'

      - name: Record OTA bundle digest
        if: ${{ inputs.publish }}
        id: digest
        run: |
          digest="$(docker buildx imagetools inspect '${{ steps.image.outputs.image }}' \
            --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Release summary
        if: always()
        env:
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          {
            echo "## NubArca TV OTA release"
            echo
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Runtime: \`${{ steps.bundle.outputs.runtime }}\`"
            echo "- Update: \`${{ steps.bundle.outputs.update_id }}\`"
            echo "- GHCR publication requested: \`$REQUESTED_PUBLISH\`"
            if [[ "$REQUESTED_PUBLISH" == "true" ]]; then
              echo "- Server pull: \`${{ steps.image.outputs.image }}@${{ steps.digest.outputs.digest }}\`"
            fi
            echo "- Production activation: **pending server-side pull**"
            echo "- Physical Fire Stick acceptance: **pending**"
          } >> "$GITHUB_STEP_SUMMARY"
