name: Backend full verification

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-full-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  backend-full:
    name: Backend full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore tests/NubArca.Api.Tests/NubArca.Api.Tests.csproj

      - name: Build
        run: >-
          dotnet build tests/NubArca.Api.Tests/NubArca.Api.Tests.csproj
          --configuration Release
          --no-restore

      # The production media tools (FFmpeg 9 — the digest the API Dockerfile
      # pins), so the HEIC tests decode for real instead of being skipped. The
      # package is public; nothing to log in to.
      - name: Install media tools
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          digest="$(sed -n 's/^ARG MEDIA_TOOLS_IMAGE=.*@\(sha256:[0-9a-f]\{64\}\)$/\1/p' src/NubArca.Api/Dockerfile)"
          cid="$(docker create "ghcr.io/${owner}/nubarca-media-tools@${digest}" /none)"
          sudo mkdir -p /opt/nubarca/media
          sudo docker cp "$cid:/opt/nubarca/media/." /opt/nubarca/media/
          docker rm "$cid" >/dev/null
          echo /opt/nubarca/media/bin >> "$GITHUB_PATH"
          /opt/nubarca/media/bin/ffmpeg -hide_banner -version | head -1

      - name: Run full backend test suite
        run: >-
          scripts/test-backend-full.sh
          --configuration Release
          --no-restore
          --no-build
          --logger trx
          --results-directory "$GITHUB_WORKSPACE/TestResults/backend-full"

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-full-test-results
          path: TestResults/backend-full/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
