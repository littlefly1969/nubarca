name: Backend full verification

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-full-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  backend-full:
    name: Backend full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore tests/NubArca.Api.Tests/NubArca.Api.Tests.csproj

      - name: Build
        run: >-
          dotnet build tests/NubArca.Api.Tests/NubArca.Api.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run full backend test suite
        run: >-
          scripts/test-backend-full.sh
          --configuration Release
          --no-restore
          --no-build
          --logger trx
          --results-directory "$GITHUB_WORKSPACE/TestResults/backend-full"

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-full-test-results
          path: TestResults/backend-full/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
