name: Print Agent release

# The station is independent from the server containers. This manual main-only
# workflow emits a self-contained Windows service or Linux simulator bundle;
# installation and enrollment remain explicit operator actions on the station.
on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Target platform and architecture
        required: true
        default: win-x64
        type: choice
        options:
          - win-x64
          - win-arm64
          - linux-x64
      publish:
        description: Publish the linux-x64 bundle to GHCR for the printers page (pull-publish-print-agent-image.sh)
        required: true
        default: true
        type: boolean
  # The Release workflow (release.yml) calls it for linux-x64 when the agent changed.
  workflow_call:
    inputs:
      runtime:
        type: string
        default: linux-x64
      publish:
        type: boolean
        default: true
    # The bundle image this run pushed, for the Release workflow's manifest.
    outputs:
      digest:
        value: ${{ jobs.release.outputs.digest }}

permissions:
  contents: read
  packages: write

concurrency:
  group: print-agent-release-${{ inputs.runtime }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and validate headless Print Agent
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enforce release policy
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Print Agent releases are allowed only from main; got $GITHUB_REF" >&2
            exit 1
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore Print Agent tests
        run: dotnet restore tests/NubArca.PrintAgent.Tests/NubArca.PrintAgent.Tests.csproj

      - name: Test Print Agent
        run: dotnet test tests/NubArca.PrintAgent.Tests/NubArca.PrintAgent.Tests.csproj --no-restore --configuration Release

      - name: Publish self-contained agent bundle
        env:
          RUNTIME: ${{ inputs.runtime }}
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/NubArca.PrintAgent/NubArca.PrintAgent.csproj)"
          [[ -n "$version" ]] || { echo 'Print Agent version is missing' >&2; exit 1; }
          output="$RUNNER_TEMP/nubarca-print-agent-${version}-${RUNTIME}"
          dotnet publish src/NubArca.PrintAgent/NubArca.PrintAgent.csproj \
            --configuration Release --runtime "$RUNTIME" --self-contained true \
            --no-restore -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false \
            --output "$output"
          printf '%s\n' "$GITHUB_SHA" > "$output/source-commit.txt"
          executable='NubArca.PrintAgent'
          [[ "$RUNTIME" == win-* ]] && executable='NubArca.PrintAgent.exe'
          (cd "$output" && sha256sum "$executable" > SHA256SUMS)
          echo "output=$output" >> "$GITHUB_OUTPUT"
          echo "artifact=nubarca-print-agent-${version}-${RUNTIME}" >> "$GITHUB_OUTPUT"
        id: publish

      - name: Validate Linux simulator and Print Box bundle
        if: inputs.runtime == 'linux-x64'
        run: |
          set -euo pipefail
          output="${{ steps.publish.outputs.output }}"
          test -x "$output/NubArca.PrintAgent"
          test -f "$output/linux/install-fake-instance.sh"
          test -f "$output/linux/uninstall-instance.sh"
          test -f "$output/linux/nubarca-print-agent@.service"
          test -x "$output/linux/install-print-box.sh"
          test -f "$output/linux/nubarca-print-box.rules"
          test -f "$output/linux/nubarca-media-status.test"
          test -f "$output/linux/nubarca-sim"
          test -f "$output/linux/install-simulated-printer.sh"
          test -f "$output/linux/update-print-box.sh"
          test -f "$output/linux/nubarca-print-agent-update.path"
          test -f "$output/linux/nubarca-print-agent-update.service"

      - name: Upload Print Agent bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.publish.outputs.artifact }}
          path: ${{ steps.publish.outputs.output }}
          if-no-files-found: error
          retention-days: 30

      # The Print Box bundle as the printers page hands it out: the zip, its
      # .sha256 and a manifest naming both, as one immutable GHCR image the
      # server pulls by digest (deploy/pull-publish-print-agent-image.sh).
      - name: Package the Print Box bundle
        if: inputs.runtime == 'linux-x64' && inputs.publish
        id: package
        env:
          OUTPUT: ${{ steps.publish.outputs.output }}
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/NubArca.PrintAgent/NubArca.PrintAgent.csproj)"
          release="$RUNNER_TEMP/print-agent-release"
          install -d -m 0755 "$release"
          zip_name="nubarca-print-agent-${version}-linux-x64.zip"
          (cd "$OUTPUT" && zip -qr -X "$release/$zip_name" .)
          (cd "$release" && sha256sum "$zip_name" > "$zip_name.sha256")
          python3 - "$release" "$zip_name" "$version" "$GITHUB_SHA" <<'PY'
          import hashlib, json, os, sys
          root, name, version, commit = sys.argv[1:5]
          path = os.path.join(root, name)
          digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
          manifest = {"artifact": "print-agent", "version": version, "runtime": "linux-x64", "fileName": name,
                      "sha256": digest, "sizeBytes": os.path.getsize(path), "sourceCommit": commit}
          with open(os.path.join(root, "nubarca-print-agent.release.json"), "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "release=$release"
            echo "version=$version"
            echo "image=ghcr.io/${owner}/nubarca-print-agent:${GITHUB_SHA}-linux-x64"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: inputs.runtime == 'linux-x64' && inputs.publish
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.runtime == 'linux-x64' && inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the immutable Print Box bundle image
        if: inputs.runtime == 'linux-x64' && inputs.publish
        id: image
        env:
          IMAGE: ${{ steps.package.outputs.image }}
          RELEASE: ${{ steps.package.outputs.release }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Immutable bundle image already exists: $IMAGE" >&2
            exit 1
          fi
          docker buildx build --load \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg RELEASE_VERSION="$VERSION" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -f deploy/Dockerfile.print-agent-bundle -t "$IMAGE" "$RELEASE"
          docker push "$IMAGE"
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          repository="${IMAGE%:*}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Print Box bundle $VERSION"
            echo
            echo "Publish it on the server, from the production checkout:"
            echo
            echo '```bash'
            echo "./deploy/pull-publish-print-agent-image.sh ${repository}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
