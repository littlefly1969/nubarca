name: Build production images

# Manual only, deliberately.
#
# This workflow only builds, verifies and publishes immutable application
# images. Deployment remains a separate explicit production step.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-production-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

# Backend and frontend are INDEPENDENT jobs, deliberately parallel. They share
# nothing but the source SHA, so serialising them would only make the slower one
# the release's latency for no gate it does not already have — and a frontend
# failure has no business holding a good backend image hostage, or vice versa.
jobs:
  backend:
    name: Build and publish production API images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # GHCR namespaces are lowercase; the owner is read from the repository
      # rather than written down, so the workflow describes the PRODUCT and not
      # one account.
      - name: Resolve image references
        id: refs
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          sha='${{ github.sha }}'
          {
            echo "owner=$owner"
            echo "sha=$sha"
            echo "runtime=${REGISTRY}/${owner}/nubarca-api:${sha}"
            echo "openvino=${REGISTRY}/${owner}/nubarca-api-openvino:${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both images are built into the local daemon FIRST and pushed only after
      # they verify. An unverifiable image that is already published is a thing
      # someone can deploy; one that never got pushed is not.
      - name: Build lean runtime image
        run: >-
          docker buildx build --load
          --target runtime
          --build-arg GIT_SHA=${{ steps.refs.outputs.sha }}
          -f src/NubArca.Api/Dockerfile
          -t ${{ steps.refs.outputs.runtime }}
          .

      - name: Build OpenVINO runtime image
        run: >-
          docker buildx build --load
          --target runtime-openvino
          --build-arg GIT_SHA=${{ steps.refs.outputs.sha }}
          -f src/NubArca.Api/Dockerfile
          -t ${{ steps.refs.outputs.openvino }}
          .

      - name: Verify lean runtime image
        run: >-
          scripts/verify-production-image.sh
          ${{ steps.refs.outputs.runtime }}
          ${{ steps.refs.outputs.sha }}
          runtime

      - name: Verify OpenVINO runtime image
        run: >-
          scripts/verify-production-image.sh
          ${{ steps.refs.outputs.openvino }}
          ${{ steps.refs.outputs.sha }}
          openvino

      # Only the immutable SHA tag is pushed. There is no `latest`: a deploy
      # must name the exact source it is running, and a moving tag cannot say
      # which commit produced the bytes.
      - name: Push images
        run: |
          set -euo pipefail
          docker push '${{ steps.refs.outputs.runtime }}'
          docker push '${{ steps.refs.outputs.openvino }}'

      - name: Record digests
        id: digests
        run: |
          set -euo pipefail
          runtime_digest="$(docker buildx imagetools inspect '${{ steps.refs.outputs.runtime }}' \
            --format '{{.Manifest.Digest}}')"
          openvino_digest="$(docker buildx imagetools inspect '${{ steps.refs.outputs.openvino }}' \
            --format '{{.Manifest.Digest}}')"
          {
            echo "runtime_digest=$runtime_digest"
            echo "openvino_digest=$openvino_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Report
        run: |
          {
            echo "## Production images"
            echo
            echo "Source SHA: \`${{ steps.refs.outputs.sha }}\`"
            echo
            echo "| Variant | Image | Digest |"
            echo "| --- | --- | --- |"
            echo "| runtime | \`${{ steps.refs.outputs.runtime }}\` | \`${{ steps.digests.outputs.runtime_digest }}\` |"
            echo "| runtime-openvino | \`${{ steps.refs.outputs.openvino }}\` | \`${{ steps.digests.outputs.openvino_digest }}\` |"
            echo
            echo "Both images verified before publication: provenance stamp, ASP.NET runtime,"
            echo "ffmpeg/ffprobe, and the ONNX Runtime layer each variant is supposed to carry."
            echo "GPU execution is NOT exercised here — \`/dev/dri\` belongs to an installation."
            echo
            echo "This workflow publishes artifacts only; deployment remains a separate,"
            echo "explicit production step."
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Build and publish production frontend image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve image reference
        id: refs
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          sha='${{ github.sha }}'
          {
            echo "owner=$owner"
            echo "sha=$sha"
            echo "frontend=${REGISTRY}/${owner}/nubarca-frontend:${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The frontend records its provenance as an OCI label rather than an
      # application variable: nginx has no use for one, and a label is the
      # standard place a build says what it came from. `npm run build` already
      # runs `tsc -b && vite build`, so the Dockerfile needs no change to move
      # the compile here — which is the point of this migration.
      - name: Build frontend image
        run: >-
          docker buildx build --load
          --label org.opencontainers.image.revision=${{ steps.refs.outputs.sha }}
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          -f frontend/Dockerfile
          -t ${{ steps.refs.outputs.frontend }}
          frontend

      - name: Verify frontend image
        run: >-
          scripts/verify-production-frontend-image.sh
          ${{ steps.refs.outputs.frontend }}
          ${{ steps.refs.outputs.sha }}

      - name: Push image
        run: docker push '${{ steps.refs.outputs.frontend }}'

      - name: Record digest
        id: digest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect '${{ steps.refs.outputs.frontend }}' \
            --format '{{.Manifest.Digest}}')"
          echo "frontend_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Report
        run: |
          {
            echo "## Production frontend image"
            echo
            echo "Source SHA: \`${{ steps.refs.outputs.sha }}\`"
            echo
            echo "| Variant | Image | Digest |"
            echo "| --- | --- | --- |"
            echo "| frontend | \`${{ steps.refs.outputs.frontend }}\` | \`${{ steps.digest.outputs.frontend_digest }}\` |"
            echo
            echo "Verified before publication by running the container: nginx config,"
            echo "hashed Vite bundles, SPA fallback, and that a missing /assets file"
            echo "still 404s instead of being answered with index.html."
            echo
            echo "\`/tv.apk\` and \`/download/tv/*\` are NOT tested here — they come from an"
            echo "installation volume, never from this image."
          } >> "$GITHUB_STEP_SUMMARY"
